<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shift Night - نظام إدارة وتحصيل المبالغ السحابي</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, query, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAgkwoY5Fvpo8_G1CascrQ3T2DqKCjVVyg",
      authDomain: "shift-night.firebaseapp.com",
      projectId: "shift-night",
      storageBucket: "shift-night.firebasestorage.app",
      messagingSenderId: "695940731884",
      appId: "1:695940731884:web:d4721d29537c6e3ccca6c9",
      measurementId: "G-PW8FGVNCWR"
    };

    const appId = 'shift-night-live-db';
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    window.CloudDB = {
      db, auth, appId, collection, addDoc, onSnapshot, deleteDoc, doc, query, setDoc, getDoc,
      signInAnonymously: signInAnonymously
    };

    window.addEventListener('load', () => {
      setTimeout(() => {
        if (window.initCloudSync) window.initCloudSync();
      }, 500);
    });
  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap');
    body { font-family: 'Cairo', sans-serif; transition: background 0.4s ease, color 0.4s ease; }
    body.theme-midnight { background: radial-gradient(circle at top right, #0f172a, #020617 80%); color: #f8fafc; }
    body.theme-cyber { background: radial-gradient(circle at top right, #090d16, #030712 80%); color: #f1f5f9; }
    body.theme-espresso { background: radial-gradient(circle at top right, #1c130e, #0c0806 80%); color: #fef3c7; }
    body.theme-light { background: radial-gradient(circle at top right, #f8fafc, #e2e8f0 80%); color: #0f172a; }
    .glass-card { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); transition: all 0.3s ease; }
    body.theme-light .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); border: 1px solid rgba(0, 0, 0, 0.08); }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 9999px; }
    
    @keyframes marquee { 
      0% { transform: translateX(-100%); } 
      100% { transform: translateX(100%); } 
    }
    .ticker-wrap { width: 100%; overflow: hidden; background: #b45309; color: white; padding: 10px 0; box-sizing: content-box; }
    .ticker { display: inline-block; white-space: nowrap; padding-left: 100%; animation: marquee 80s linear infinite; font-weight: bold; font-size: 1.1rem; }
  </style>
</head>
<body class="theme-midnight min-h-screen custom-scrollbar">

  <div id="app"></div>

  <script>
    const INITIAL_EMPLOYEES = [
      "Adham Mohamed", "Ahmed Rafee", "Ehab Emad", "Eman Ezzat", "Ezz Mohamed",
      "Ghada Ahmed", "Habiba Mahmoud", "Malak Atef", "Malak Mosaed", "Maraim Mahmoud",
      "Marwan", "Mayada Ibrahim", "Menna Sayed", "Mohamed Emad", "Mohamed Sabry",
      "Mohamed Tarek", "Nada Ibrahim", "Nagham Mohammed", "Rodina Mostafa",
      "Salsabel Mahmoud", "Seif Tamer", "Shahd Mohamed", "Youssef Gaber", "Youssef Mohamed"
    ];

    const getTodayString = () => new Date().toISOString().split('T')[0];
    const formatCurrency = (val) => (Number(val) || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const getEmployeeImage = (name) => `https://raw.githubusercontent.com/ehabe0649-hue/shift-night/main/${name.replace(/ /g, '_')}.jpg`;

    // دالة توليد الصوت باستخدام Web Audio API (مضمونة 100%)
    function playNotificationSound() {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        
        const ctx = new AudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        
        osc.connect(gain);
        gain.connect(ctx.destination);
        
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, ctx.currentTime); // نغمة عالية
        osc.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + 0.1); // تنزل شوية
        
        gain.gain.setValueAtTime(0.5, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
        
        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + 0.5);
      } catch (e) {
        console.log("Audio play error:", e);
      }
    }

    const getHeroData = () => {
      const today = new Date();
      const dayOfMonth = today.getDate();
      const todayStr = getTodayString();
      const monthStr = getTodayString().slice(0, 7);

      if (dayOfMonth === 30) {
        return { name: "Mohamed Maher", amount: 0, isMonthly: false, isLeader: true };
      }

      let isMonthlyMode = dayOfMonth >= 21;
      let relevantCollections = isMonthlyMode 
        ? state.collections.filter(c => c.date.startsWith(monthStr))
        : state.collections.filter(c => c.date === todayStr);

      if (relevantCollections.length === 0) return null;

      const totalsByEmp = {};
      const notesByEmp = {};
      relevantCollections.forEach(c => {
        if (!totalsByEmp[c.employeeName]) { totalsByEmp[c.employeeName] = 0; notesByEmp[c.employeeName] = ''; }
        totalsByEmp[c.employeeName] += c.amount;
        if (c.notes) notesByEmp[c.employeeName] += ' ' + c.notes;
      });

      let heroName = null;
      let maxAmount = 0;
      for (const [name, total] of Object.entries(totalsByEmp)) {
        if (total > maxAmount) { maxAmount = total; heroName = name; }
      }

      const heroNotes = notesByEmp[heroName] || '';
      const isSedadMaher = heroNotes.includes('سداد ماهر');

      return { name: heroName, amount: maxAmount, isMonthly: isMonthlyMode, isSedadMaher: isSedadMaher, isLeader: false };
    };

    let state = {
      currentView: 'employee',
      isAdminLoggedIn: false,
      currentTheme: localStorage.getItem('shift_night_theme') || 'midnight',
      collections: JSON.parse(localStorage.getItem('shift_night_local_fallback')) || [],
      newsTicker: '',
      isTickerActive: false,
      dateRangeFilter: 'all',
      specificDate: getTodayString(),
      specificMonth: getTodayString().slice(0, 7),
      selectedEmployeeFilter: 'all',
      searchQuery: '',
      loginError: '',
      employeeSuccessMsg: '',
      isCloudConnected: false,
      soundEnabled: localStorage.getItem('shift_night_sound') === 'true'
    };

    window.toggleSound = function() {
      state.soundEnabled = !state.soundEnabled;
      localStorage.setItem('shift_night_sound', state.soundEnabled);
      if (state.soundEnabled) {
        playNotificationSound();
      }
      render();
    };

    window.initCloudSync = async function() {
      if (!window.CloudDB) return;
      const { db, auth, appId, collection, onSnapshot, signInAnonymously, doc } = window.CloudDB;

      try {
        await signInAnonymously(auth);
        
        const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'collections');
        onSnapshot(colRef, (snapshot) => {
          const cloudData = [];
          snapshot.forEach((docSnap) => { cloudData.push({ id: docSnap.id, ...docSnap.data() }); });
          cloudData.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
          
          // تشغيل الصوت لو فيه سجل جديد
          if (state.collections.length > 0 && cloudData.length > 0 && cloudData[0].id !== state.collections[0].id) {
            if (state.soundEnabled) {
              playNotificationSound();
            }
          }

          state.collections = cloudData;
          state.isCloudConnected = true;
          localStorage.setItem('shift_night_local_fallback', JSON.stringify(cloudData));
          render();
        });

        const tickerDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'news_ticker');
        onSnapshot(tickerDocRef, (docSnap) => {
          if (docSnap.exists()) {
            const data = docSnap.data();
            state.newsTicker = data.text || '';
            state.isTickerActive = data.active || false;
          } else {
            state.newsTicker = '';
            state.isTickerActive = false;
          }
          render();
        });

      } catch (err) {
        console.error("Auth / Cloud error:", err);
        state.isCloudConnected = false;
        render();
      }
    };

    function saveCollectionsLocally() { localStorage.setItem('shift_night_local_fallback', JSON.stringify(state.collections)); }
    function setTheme(themeName) { state.currentTheme = themeName; localStorage.setItem('shift_night_theme', themeName); render(); }

    window.updateNewsTicker = async function(text, active) {
      if (!window.CloudDB) return;
      const { db, appId, doc, setDoc } = window.CloudDB;
      const tickerDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'news_ticker');
      try {
        await setDoc(tickerDocRef, { text: text, active: active }, { merge: true });
        state.newsTicker = text;
        state.isTickerActive = active;
        render();
      } catch (err) { console.error("Error updating ticker:", err); alert("حدث خطأ أثناء تحديث النشرة"); }
    };

    function render() {
      document.body.className = `theme-${state.currentTheme} min-h-screen custom-scrollbar`;
      const app = document.getElementById('app');
      app.innerHTML = `
        <header class="bg-slate-900/90 backdrop-blur-md border-b border-slate-800/80 sticky top-0 z-50 shadow-2xl">
          <div class="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3.5 space-x-reverse">
              <div class="w-12 h-12 bg-gradient-to-tr from-amber-500 via-amber-400 to-emerald-400 rounded-2xl flex items-center justify-center text-slate-950 font-black text-2xl shadow-lg shadow-amber-500/20">🌙</div>
              <div>
                <h1 class="text-xl font-black tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-amber-400 via-emerald-300 to-amber-200">Shift Night Live</h1>
                <p class="text-[11px] font-bold ${state.isCloudConnected ? 'text-emerald-400' : 'text-red-400'} flex items-center gap-1">
                  <span class="w-2 h-2 rounded-full ${state.isCloudConnected ? 'bg-emerald-400 animate-pulse' : 'bg-red-500'}"></span>
                  ${state.isCloudConnected ? 'متصل سحابياً مباشر ✅' : 'وضع محلي فقط ⚠️'}
                </p>
              </div>
            </div>

            <div class="flex items-center gap-3">
              <button onclick="toggleSound()" class="px-3 py-2 rounded-xl text-xs font-bold transition-all ${state.soundEnabled ? 'bg-emerald-600 text-white' : 'bg-slate-800 text-slate-400 border border-slate-700'}">
                ${state.soundEnabled ? '🔔 الإشعارات شغالة' : '🔕 تشغيل الإشعارات'}
              </button>
              
              <div class="flex items-center bg-slate-900 border border-slate-800 rounded-2xl p-1 gap-1">
                <button onclick="setTheme('midnight')" class="p-2 rounded-xl hover:bg-slate-800 text-amber-400 text-xs font-bold transition-all ${state.currentTheme === 'midnight' ? 'bg-slate-800 border border-amber-500/40' : ''}">🌙</button>
                <button onclick="setTheme('cyber')" class="p-2 rounded-xl hover:bg-slate-800 text-purple-400 text-xs font-bold transition-all ${state.currentTheme === 'cyber' ? 'bg-slate-800 border border-purple-500/40' : ''}">🌌</button>
                <button onclick="setTheme('espresso')" class="p-2 rounded-xl hover:bg-slate-800 text-amber-600 text-xs font-bold transition-all ${state.currentTheme === 'espresso' ? 'bg-slate-800 border border-amber-600/40' : ''}">☕</button>
                <button onclick="setTheme('light')" class="p-2 rounded-xl hover:bg-slate-800 text-slate-300 text-xs font-bold transition-all ${state.currentTheme === 'light' ? 'bg-slate-800 border border-slate-400' : ''}">☀️</button>
              </div>

              ${state.currentView === 'employee' ? `
                <button onclick="navigate('admin_login')" class="bg-gradient-to-r from-amber-500 to-amber-600 text-slate-950 font-black text-xs px-4 py-2.5 rounded-2xl shadow-lg">
                  Admin Login 🔒
                </button>
              ` : `
                <button onclick="navigate('employee')" class="bg-slate-800 text-amber-400 border border-slate-700 font-bold text-xs px-3.5 py-2.5 rounded-2xl">
                  واجهة الموظف
                </button>
                ${state.isAdminLoggedIn ? `
                  <button onclick="logoutAdmin()" class="bg-red-950/80 text-red-300 border border-red-800 font-bold text-xs px-3.5 py-2.5 rounded-2xl">
                    Logout
                  </button>
                ` : ''}
              `}
            </div>
          </div>
          
          ${state.isTickerActive && state.newsTicker ? `<div class="ticker-wrap"><div class="ticker">📢 ${state.newsTicker} 📢</div></div>` : ''}
        </header>

        <main class="max-w-7xl mx-auto px-4 py-8">
          ${renderHero()}
          ${renderContent()}
        </main>
      `;

      if (state.currentView === 'admin_dashboard' && state.isAdminLoggedIn) initCharts();
    }

    function renderHero() {
      const hero = getHeroData();
      if (!hero) return '';

      if (hero.isLeader) {
        return `
          <div class="mb-8 relative overflow-hidden glass-card rounded-3xl p-6 sm:p-8 border-2 border-amber-500/50 shadow-[0_0_40px_rgba(245,158,11,0.2)] bg-gradient-to-br from-slate-900 via-slate-900 to-amber-900/20">
            <div class="absolute top-0 right-0 bg-amber-500 text-slate-950 font-black text-xs px-4 py-1.5 rounded-bl-2xl shadow-lg z-10">LEADER APPRECIATION</div>
            <div class="flex flex-col sm:flex-row items-center gap-6 relative z-0">
              <div class="relative shrink-0">
                <div class="w-28 h-28 sm:w-32 sm:h-32 rounded-full border-4 border-amber-500 shadow-[0_0_20px_rgba(245,158,11,0.5)] overflow-hidden bg-slate-800 flex items-center justify-center">
                  <img src="${getEmployeeImage(hero.name)}" alt="${hero.name}" class="w-full h-full object-cover" onerror="this.style.display='none'; this.parentElement.innerHTML='<span class=\\'text-4xl\\'>👤</span>';" />
                </div>
              </div>
              <div class="text-center sm:text-right flex-1">
                <p class="text-amber-400 font-bold text-sm mb-1 uppercase tracking-wider">Thank You For Your Leadership</p>
                <h2 class="text-3xl font-black text-white mb-2" dir="ltr">${hero.name}</h2>
                <p class="text-slate-300 font-bold italic text-sm bg-slate-800/50 inline-block px-4 py-1.5 rounded-xl border border-slate-700">"Your guidance lights our way every night! 🌟"</p>
              </div>
            </div>
          </div>
        `;
      }

      const title = hero.isMonthly ? "CHAMPION OF THE MONTH" : "HERO OF THE DAY";
      const subtitle = hero.isMonthly ? "أعلى إجمالي تحصيل من أول الشهر" : "أعلى تحصيل لليوم";
      const imageName = hero.isSedadMaher ? "Mohamed Maher" : hero.name;
      const displayName = hero.name;

      return `
        <div class="mb-8 relative overflow-hidden glass-card rounded-3xl p-6 sm:p-8 border-2 border-amber-500/50 shadow-[0_0_40px_rgba(245,158,11,0.2)] bg-gradient-to-br from-slate-900 via-slate-900 to-amber-900/20">
          <div class="absolute top-0 right-0 bg-amber-500 text-slate-950 font-black text-xs px-4 py-1.5 rounded-bl-2xl shadow-lg z-10">${title}</div>
          <div class="flex flex-col sm:flex-row items-center gap-6 relative z-0">
            <div class="relative shrink-0">
              <div class="w-28 h-28 sm:w-32 sm:h-32 rounded-full border-4 border-amber-500 shadow-[0_0_20px_rgba(245,158,11,0.5)] overflow-hidden bg-slate-800 flex items-center justify-center">
                <img src="${getEmployeeImage(imageName)}" alt="${displayName}" class="w-full h-full object-cover" onerror="this.style.display='none'; this.parentElement.innerHTML='<span class=\\'text-4xl\\'>👤</span>';" />
              </div>
              <div class="absolute -bottom-2 -right-2 bg-amber-500 text-slate-950 font-black text-xl w-10 h-10 rounded-full flex items-center justify-center border-4 border-slate-900 shadow-lg">1</div>
            </div>
            <div class="text-center sm:text-right flex-1">
              <p class="text-amber-400 font-bold text-sm mb-1 uppercase tracking-wider">${subtitle}</p>
              <h2 class="text-3xl font-black text-white mb-2" dir="ltr">${displayName}</h2>
              ${hero.isSedadMaher ? `<p class="text-emerald-400 font-bold text-sm mb-1">🏆 سداد ماهر - Mohamed Maher</p>` : ''}
              <p class="text-emerald-400 font-black text-xl mb-3" dir="ltr">${formatCurrency(hero.amount)} EGP</p>
              <p class="text-slate-300 font-bold italic text-sm bg-slate-800/50 inline-block px-4 py-1.5 rounded-xl border border-slate-700">"Champions keep playing until they get it right. Keep going! 🚀"</p>
            </div>
          </div>
        </div>
      `;
    }

    window.handlePaymentTypeChange = function() {
      const type = document.getElementById('empPaymentType').value;
      const dateDiv = document.getElementById('dateDiv');
      if (type === 'غير معروف') { dateDiv.style.display = 'none'; document.getElementById('empDate').required = false; }
      else { dateDiv.style.display = 'block'; document.getElementById('empDate').required = true; }
    };

    function renderContent() {
      if (state.currentView === 'employee') {
        return `
          <div class="max-w-xl mx-auto glass-card rounded-3xl shadow-2xl p-6 sm:p-10 relative border border-slate-800">
            <div class="text-center pb-6 border-b border-slate-800/80 mb-6">
              <span class="inline-block bg-emerald-500/10 text-emerald-400 text-[11px] font-extrabold px-3 py-1 rounded-full border border-emerald-500/20 mb-3">● الرابط التفاعلي المباشر</span>
              <h2 class="text-2xl font-black text-slate-100">إدخال مبلغ التحصيل</h2>
              <p class="text-xs text-slate-400 mt-1">يتم حفظ وإرسال البيانات فوراً للـ Team Leader</p>
            </div>
            ${state.employeeSuccessMsg ? `<div class="mb-6 bg-emerald-950/80 border border-emerald-500/40 text-emerald-300 p-4 rounded-2xl text-xs font-bold flex justify-between items-center animate-bounce"><span>✅ ${state.employeeSuccessMsg}</span></div>` : ''}
            <form onsubmit="handleEmployeeSubmit(event)" class="space-y-5">
              <div>
                <label class="block text-xs font-extrabold text-amber-400 mb-2">اسم الموظف *</label>
                <select id="empName" required class="w-full bg-slate-900/90 border border-slate-700 text-slate-100 rounded-2xl p-3.5 font-bold text-sm outline-none">
                  <option value="" disabled selected>اختر اسم الموظف...</option>
                  ${INITIAL_EMPLOYEES.map(emp => `<option value="${emp}">${emp}</option>`).join('')}
                </select>
              </div>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                  <label class="block text-xs font-extrabold text-amber-400 mb-2">المبلغ المحصل (ج.م) *</label>
                  <input type="number" id="empAmount" step="0.01" min="0.01" placeholder="0.00" class="w-full bg-slate-900/90 border border-slate-700 text-emerald-400 rounded-2xl p-3.5 text-lg font-black outline-none" required />
                </div>
                <div id="dateDiv">
                  <label class="block text-xs font-extrabold text-amber-400 mb-2">التاريخ *</label>
                  <input type="date" id="empDate" value="${getTodayString()}" class="w-full bg-slate-900/90 border border-slate-700 text-slate-100 rounded-2xl p-3.5 font-bold text-sm outline-none" required />
                </div>
              </div>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                  <label class="block text-xs font-extrabold text-amber-400 mb-2">إثباتات التحصيل *</label>
                  <select id="empPaymentType" required onchange="handlePaymentTypeChange()" class="w-full bg-slate-900/90 border border-slate-700 text-slate-100 rounded-2xl p-3.5 font-bold text-sm outline-none">
                    <option value="" disabled selected>اختر نوع الإثبات...</option>
                    <option value="إيصال">إيصال</option>
                    <option value="اتصالات كاش">اتصالات كاش</option>
                    <option value="مشكلة في الكاش">مشكلة في الكاش</option>
                    <option value="غير معروف">غير معروف</option>
                  </select>
                </div>
                <div>
                  <label class="block text-xs font-extrabold text-amber-400 mb-2">Account Number *</label>
                  <input type="text" id="empAccount" placeholder="Enter Account Number" class="w-full bg-slate-900/90 border border-slate-700 text-slate-100 rounded-2xl p-3.5 text-sm outline-none font-mono text-right" required />
                </div>
              </div>
              <div>
                <label class="block text-xs font-extrabold text-slate-300 mb-2">ملاحظات (اختياري)</label>
                <textarea id="empNotes" rows="2" placeholder="أي تفاصيل أخرى..." class="w-full bg-slate-900/90 border border-slate-700 text-slate-100 rounded-2xl p-3 text-sm outline-none"></textarea>
              </div>
              <button type="submit" class="w-full bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-black py-4 rounded-2xl text-base shadow-xl">تأكيد وحفظ المبلغ 🚀</button>
            </form>
          </div>
        `;
      }

      if (state.currentView === 'admin_login') {
        return `
          <div class="max-w-md mx-auto glass-card rounded-3xl shadow-2xl p-8 border border-slate-800">
            <div class="text-center mb-6">
              <h2 class="text-xl font-black text-amber-400">Team Leader Login</h2>
              <p class="text-xs text-slate-400 mt-1">Enter your credentials to access the dashboard</p>
            </div>
            ${state.loginError ? `<div class="mb-4 bg-red-950/80 border border-red-800 text-red-300 p-3 rounded-xl text-xs font-bold">⚠️ ${state.loginError}</div>` : ''}
            <form onsubmit="handleLoginSubmit(event)" class="space-y-4 text-left" dir="ltr">
              <div>
                <label class="block text-xs font-bold text-slate-300 mb-1.5">Username</label>
                <input type="text" id="loginUser" placeholder="Enter username" class="w-full bg-slate-900 border border-slate-700 text-slate-100 rounded-xl p-3 text-sm outline-none" required />
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-300 mb-1.5">Password</label>
                <input type="password" id="loginPass" placeholder="Enter password" class="w-full bg-slate-900 border border-slate-700 text-slate-100 rounded-xl p-3 text-sm outline-none" required />
              </div>
