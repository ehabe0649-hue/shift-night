<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shift Night - نظام إدارة وتحصيل المبالغ السحابي</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Firebase Live Real-time Database Integration -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, query } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // بيانات مشروعك الحقيقية (تم تصحيح المفتاح من صورتك الأخيرة)
    const firebaseConfig = {
      apiKey: "AIzaSyAgkwoY5Fvpo8_G1CascrQ3T2DqKCjVVyg",
      authDomain: "shift-night.firebaseapp.com",
      projectId: "shift-night",
      storageBucket: "shift-night.firebasestorage.app",
      messagingSenderId: "695940731884",
      appId: "1:695940731884:web:d4721d29537c6e3ccca6c9",
      measurementId: "G-PW8FGVNCWR"
    };

    const appId = 'shift-night-live-db';
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    window.CloudDB = {
      db,
      auth,
      appId,
      collection,
      addDoc,
      onSnapshot,
      deleteDoc,
      doc,
      signInAnonymously
    };

    window.addEventListener('load', () => {
      setTimeout(() => {
        if (window.initCloudSync) window.initCloudSync();
      }, 500);
    });
  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap');
    body {
      font-family: 'Cairo', sans-serif;
      transition: background 0.4s ease, color 0.4s ease;
    }

    body.theme-midnight { background: radial-gradient(circle at top right, #0f172a, #020617 80%); color: #f8fafc; }
    body.theme-cyber { background: radial-gradient(circle at top right, #090d16, #030712 80%); color: #f1f5f9; }
    body.theme-espresso { background: radial-gradient(circle at top right, #1c130e, #0c0806 80%); color: #fef3c7; }
    body.theme-light { background: radial-gradient(circle at top right, #f8fafc, #e2e8f0 80%); color: #0f172a; }

    .glass-card {
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: all 0.3s ease;
    }

    body.theme-light .glass-card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 0, 0, 0.08);
    }

    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 9999px; }
  </style>
</head>
<body class="theme-midnight min-h-screen custom-scrollbar">

  <div id="app"></div>

  <script>
    const INITIAL_EMPLOYEES = [
      "Mayada Ibrahim", "Mohamed Tarek", "Shahd Mohamed", "Mohamed Emad",
      "Nada Ibrahim", "Nagham Mohammed", "Salsabel Mahmoud", "Ezz Mohamed",
      "Eman Ezzat", "Rodina Mostafa", "Maraim Mahmoud", "Mohamed Sabry",
      "Menna Sayed", "Ahmed Rafee", "Malak Mosaed", "Habiba Mahmoud",
      "Malak Atef", "Seif Tamer", "Adham Mohamed", "Youssef Mohamed",
      "Ehab Emad", "Youssef Gaber", "Ghada Ahmed"
    ];

    const getTodayString = () => new Date().toISOString().split('T')[0];

    const formatCurrency = (val) => {
      return (Number(val) || 0).toLocaleString('ar-EG', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    };

    let state = {
      currentView: 'employee',
      isAdminLoggedIn: false,
      currentTheme: localStorage.getItem('shift_night_theme') || 'midnight',
      collections: JSON.parse(localStorage.getItem('shift_night_local_fallback')) || [],
      dateRangeFilter: 'all',
      specificDate: getTodayString(),
      specificMonth: getTodayString().slice(0, 7),
      selectedEmployeeFilter: 'all',
      searchQuery: '',
      loginError: '',
      employeeSuccessMsg: '',
      isCloudConnected: false
    };

    window.initCloudSync = async function() {
      if (!window.CloudDB) return;
      const { db, auth, appId, collection, onSnapshot, signInAnonymously } = window.CloudDB;

      try {
        await signInAnonymously(auth);
        const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'collections');

        onSnapshot(colRef, (snapshot) => {
          const cloudData = [];
          snapshot.forEach((docSnap) => {
            cloudData.push({ id: docSnap.id, ...docSnap.data() });
          });
          cloudData.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
          state.collections = cloudData;
          state.isCloudConnected = true;
          localStorage.setItem('shift_night_local_fallback', JSON.stringify(cloudData));
          render();
        }, (error) => {
          console.warn("Cloud live sync error:", error);
          state.isCloudConnected = false;
          render();
        });
      } catch (err) {
        console.error("Auth / Cloud error:", err);
        state.isCloudConnected = false;
        render();
      }
    };

    function saveCollectionsLocally() {
      localStorage.setItem('shift_night_local_fallback', JSON.stringify(state.collections));
    }

    function setTheme(themeName) {
      state.currentTheme = themeName;
      localStorage.setItem('shift_night_theme', themeName);
      render();
    }

    function render() {
      document.body.className = `theme-${state.currentTheme} min-h-screen custom-scrollbar`;

      const app = document.getElementById('app');
      app.innerHTML = `
        <header class="bg-slate-900/90 backdrop-blur-md border-b border-slate-800/80 sticky top-0 z-50 shadow-2xl">
          <div class="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3.5 space-x-reverse">
              <div class="w-12 h-12 bg-gradient-to-tr from-amber-500 via-amber-400 to-emerald-400 rounded-2xl flex items-center justify-center text-slate-950 font-black text-2xl shadow-lg shadow-amber-500/20">🌙</div>
              <div>
                <h1 class="text-xl font-black tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-amber-400 via-emerald-300 to-amber-200">Shift Night Live</h1>
                <p class="text-[11px] font-bold ${state.isCloudConnected ? 'text-emerald-400' : 'text-red-400'} flex items-center gap-1">
                  <span class="w-2 h-2 rounded-full ${state.isCloudConnected ? 'bg-emerald-400 animate-pulse' : 'bg-red-500'}"></span>
                  ${state.isCloudConnected ? 'متصل سحابياً مباشر ✅' : 'وضع محلي فقط ⚠️'}
                </p>
              </div>
            </div>

            <div class="flex items-center gap-3">
              <div class="flex items-center bg-slate-900 border border-slate-800 rounded-2xl p-1 gap-1">
                <button onclick="setTheme('midnight')" class="p-2 rounded-xl hover:bg-slate-800 text-amber-400 text-xs font-bold transition-all ${state.currentTheme === 'midnight' ? 'bg-slate-800 border border-amber-500/40' : ''}">🌙</button>
                <button onclick="setTheme('cyber')" class="p-2 rounded-xl hover:bg-slate-800 text-purple-400 text-xs font-bold transition-all ${state.currentTheme === 'cyber' ? 'bg-slate-800 border border-purple-500/40' : ''}">🌌</button>
                <button onclick="setTheme('espresso')" class="p-2 rounded-xl hover:bg-slate-800 text-amber-600 text-xs font-bold transition-all ${state.currentTheme === 'espresso' ? 'bg-slate-800 border border-amber-600/40' : ''}">☕</button>
                <button onclick="setTheme('light')" class="p-2 rounded-xl hover:bg-slate-800 text-slate-300 text-xs font-bold transition-all ${state.currentTheme === 'light' ? 'bg-slate-800 border border-slate-400' : ''}">☀️</button>
              </div>

              ${state.currentView === 'employee' ? `
                <button onclick="navigate('admin_login')" class="bg-gradient-to-r from-amber-500 to-amber-600 text-slate-950 font-black text-xs px-4 py-2.5 rounded-2xl shadow-lg">
                  دخول المدير 🔒
                </button>
              ` : `
                <button onclick="navigate('employee')" class="bg-slate-800 text-amber-400 border border-slate-700 font-bold text-xs px-3.5 py-2.5 rounded-2xl">
                  واجهة الموظف
                </button>
                ${state.isAdminLoggedIn ? `
                  <button onclick="logoutAdmin()" class="bg-red-950/80 text-red-300 border border-red-800 font-bold text-xs px-3.5 py-2.5 rounded-2xl">
                    خروج
                  </button>
                ` : ''}
              `}
            </div>
          </div>
        </header>

        <main class="max-w-7xl mx-auto px-4 py-8">
          ${renderContent()}
        </main>
      `;

      if (state.currentView === 'admin_dashboard' && state.isAdminLoggedIn) {
        initCharts();
      }
    }

    function renderContent() {
      if (state.currentView === 'employee') {
        return `
          <div class="max-w-xl mx-auto glass-card rounded-3xl shadow-2xl p-6 sm:p-10 relative border border-slate-800">
            <div class="text-center pb-6 border-b border-slate-800/80 mb-6">
              <span class="inline-block bg-emerald-500/10 text-emerald-400 text-[11px] font-extrabold px-3 py-1 rounded-full border border-emerald-500/20 mb-3">
                ● الرابط التفاعلي المباشر
              </span>
              <h2 class="text-2xl font-black text-slate-100">إدخال مبلغ التحصيل</h2>
              <p class="text-xs text-slate-400 mt-1">يتم حفظ وإرسال البيانات فوراً للـ Team Leader</p>
            </div>

            ${state.employeeSuccessMsg ? `
              <div class="mb-6 bg-emerald-950/80 border border-emerald-500/40 text-emerald-300 p-4 rounded-2xl text-xs font-bold flex justify-between items-center animate-bounce">
                <span>✅ ${state.employeeSuccessMsg}</span>
              </div>
            ` : ''}

            <form onsubmit="handleEmployeeSubmit(event)" class="space-y-5">
              <div>
                <label class="block text-xs font-extrabold text-amber-400 mb-2">اسم الموظف *</label>
                <select id="empName" class="w-full bg-slate-900/90 border border-slate-700 text-slate-100 rounded-2xl p-3.5 font-bold text-sm outline-none">
                  ${INITIAL_EMPLOYEES.map(emp => `<option value="${emp}">${emp}</option>`).join('')}
                </select>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                  <label class="block text-xs font-extrabold text-amber-400 mb-2">المبلغ المحصل (ج.م) *</label>
                  <input type="number" id="empAmount" step="0.01" min="0.01" placeholder="0.00" class="w-full bg-slate-900/90 border border-slate-700 text-emerald-400 rounded-2xl p-3.5 text-lg font-black outline-none" required />
                </div>
                <div>
                  <label class="block text-xs font-extrabold text-amber-400 mb-2">التاريخ *</label>
                  <input type="date" id="empDate" value="${getTodayString()}" class="w-full bg-slate-900/90 border border-slate-700 text-slate-100 rounded-2xl p-3.5 font-bold text-sm outline-none" required />
                </div>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                  <label class="block text-xs font-extrabold text-amber-400 mb-2">إثباتات التحصيل *</label>
                  <select id="empPaymentType" class="w-full bg-slate-900/90 border border-slate-700 text-slate-100 rounded-2xl p-3.5 font-bold text-sm outline-none">
                    <option value="إيصال">إيصال</option>
                    <option value="اتصالات كاش">اتصالات كاش</option>
                    <option value="غير معروف">غير معروف</option>
                  </select>
                </div>
                <div>
                  <label class="block text-xs font-extrabold text-amber-400 mb-2">Account Number</label>
                  <input type="text" id="empAccount" placeholder="Enter Account Number" class="w-full bg-slate-900/90 border border-slate-700 text-slate-100 rounded-2xl p-3.5 text-sm outline-none font-mono text-right" />
                </div>
              </div>

              <div>
                <label class="block text-xs font-extrabold text-slate-300 mb-2">ملاحظات (اختياري)</label>
                <textarea id="empNotes" rows="2" placeholder="أي تفاصيل أخرى..." class="w-full bg-slate-900/90 border border-slate-700 text-slate-100 rounded-2xl p-3 text-sm outline-none"></textarea>
              </div>

              <button type="submit" class="w-full bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-black py-4 rounded-2xl text-base shadow-xl">
                تأكيد وحفظ المبلغ 🚀
              </button>
            </form>
          </div>
        `;
      }

      if (state.currentView === 'admin_login') {
        return `
          <div class="max-w-md mx-auto glass-card rounded-3xl shadow-2xl p-8 border border-slate-800">
            <div class="text-center mb-6">
              <h2 class="text-xl font-black text-amber-400">لوحة تحكم الـ Team Leader</h2>
              <p class="text-xs text-slate-400 mt-1">ادخل كلمة السر المعتمدة لمتابعة الموظفين</p>
            </div>

            ${state.loginError ? `
              <div class="mb-4 bg-red-950/80 border border-red-800 text-red-300 p-3 rounded-xl text-xs font-bold">⚠️ ${state.loginError}</div>
            ` : ''}

            <form onsubmit="handleLoginSubmit(event)" class="space-y-4">
              <div>
                <label class="block text-xs font-bold text-slate-300 mb-1.5">اسم المستخدم</label>
                <input type="text" id="loginUser" placeholder="Username" class="w-full bg-slate-900 border border-slate-700 text-slate-100 rounded-xl p-3 text-sm outline-none" required />
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-300 mb-1.5">كلمة السر</label>
                <input type="password" id="loginPass" placeholder="Password" class="w-full bg-slate-900 border border-slate-700 text-slate-100 rounded-xl p-3 text-sm outline-none" required />
              </div>
              <button type="submit" class="w-full bg-gradient-to-r from-amber-500 to-amber-600 text-slate-950 font-black py-3.5 rounded-xl text-sm shadow-lg">
                دخول اللوحة الفورية
              </button>
            </form>
          </div>
        `;
      }

      if (state.currentView === 'admin_dashboard' && state.isAdminLoggedIn) {
        const filtered = getFilteredCollections();
        const todayStr = getTodayString();
        const todayTotal = state.collections.filter(c => c.date === todayStr).reduce((acc, curr) => acc + curr.amount, 0);
        const filteredTotal = filtered.reduce((acc, curr) => acc + curr.amount, 0);
        const overallTotal = state.collections.reduce((acc, curr) => acc + curr.amount, 0);

        const summaries = INITIAL_EMPLOYEES.map(emp => {
          const items = filtered.filter(c => c.employeeName === emp);
          const totalAmount = items.reduce((sum, item) => sum + item.amount, 0);
          return { name: emp, totalAmount, count: items.length };
        }).sort((a, b) => b.totalAmount - a.totalAmount);

        return `
          <div class="space-y-6">
            <div class="glass-card rounded-3xl p-6 flex flex-wrap justify-between items-center gap-4">
              <div>
                <h2 class="text-xl font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-400 to-emerald-300">لوحة تحكم الـ Team Leader المباشرة 📊</h2>
                <p class="text-xs text-slate-400 mt-0.5">متابعة لحظية لإدخالات الـ 23 موظف من أي جهاز</p>
              </div>
              <button onclick="exportToCSV()" class="bg-gradient-to-r from-emerald-500 to-teal-600 text-slate-950 text-xs font-black px-5 py-3 rounded-2xl shadow-lg">
                📥 تصدير تقرير إكسيل (CSV)
              </button>
            </div>

            <div class="glass-card p-6 rounded-3xl space-y-4">
              <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                <div>
                  <label class="block text-xs font-bold text-amber-400 mb-1.5">👤 فلترة موظف معين</label>
                  <select onchange="changeFilter('selectedEmployeeFilter', this.value)" class="w-full bg-slate-900 border border-amber-500/40 text-xs rounded-xl p-3 font-bold text-slate-100 outline-none">
                    <option value="all" ${state.selectedEmployeeFilter === 'all' ? 'selected' : ''}>جميع الموظفين (الـ 23 موظف)</option>
                    ${INITIAL_EMPLOYEES.map(emp => `<option value="${emp}" ${state.selectedEmployeeFilter === emp ? 'selected' : ''}>${emp}</option>`).join('')}
                  </select>
                </div>

                <div>
                  <label class="block text-xs font-bold text-slate-300 mb-1.5">الفترة الزمنية والتاريخ</label>
                  <select onchange="changeFilter('dateRangeFilter', this.value)" class="w-full bg-slate-900 border border-slate-700 text-xs rounded-xl p-3 font-bold text-slate-100 outline-none">
                    <option value="all" ${state.dateRangeFilter === 'all' ? 'selected' : ''}>جميع التواريخ (التراكمي)</option>
                    <option value="today" ${state.dateRangeFilter === 'today' ? 'selected' : ''}>تحصيل اليوم الحالي</option>
                    <option value="specific_day" ${state.dateRangeFilter === 'specific_day' ? 'selected' : ''}>تاريخ يوم محدد</option>
                    <option value="month" ${state.dateRangeFilter === 'month' ? 'selected' : ''}>تقرير شهر بالكامل</option>
                  </select>
                </div>

                <div>
                  <label class="block text-xs font-bold text-slate-300 mb-1.5">بحث سريع (Account / الموظف)</label>
                  <input type="text" value="${state.searchQuery}" placeholder="أدخل كلمة البحث..." oninput="changeFilter('searchQuery', this.value)" class="w-full bg-slate-900 border border-slate-700 text-xs rounded-xl p-3 text-slate-100 outline-none" />
                </div>
              </div>

              ${state.dateRangeFilter === 'specific_day' || state.dateRangeFilter === 'month' ? `
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-3 border-t border-slate-800">
                  ${state.dateRangeFilter === 'specific_day' ? `
                    <div>
                      <label class="block text-xs font-bold text-amber-400 mb-1">اختر اليوم المحدد</label>
                      <input type="date" value="${state.specificDate}" onchange="changeFilter('specificDate', this.value)" class="w-full bg-slate-900 border border-amber-500/50 text-xs rounded-xl p-2.5 font-bold text-slate-100" />
                    </div>
                  ` : ''}

                  ${state.dateRangeFilter === 'month' ? `
                    <div>
                      <label class="block text-xs font-bold text-amber-400 mb-1">اختر الشهر المحدد</label>
                      <input type="month" value="${state.specificMonth}" onchange="changeFilter('specificMonth', this.value)" class="w-full bg-slate-900 border border-amber-500/50 text-xs rounded-xl p-2.5 font-bold text-slate-100" />
                    </div>
                  ` : ''}
                </div>
              ` : ''}
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-5">
              <div class="glass-card p-6 rounded-3xl border-r-4 border-r-emerald-500">
                <span class="text-xs font-bold text-slate-400">تحصيلات اليوم الحالي</span>
                <h3 class="text-2xl font-black text-emerald-400 mt-2">${formatCurrency(todayTotal)} <span class="text-xs text-slate-400 font-bold">ج.م</span></h3>
              </div>
              <div class="glass-card p-6 rounded-3xl border-r-4 border-r-amber-500">
                <span class="text-xs font-bold text-amber-400">إجمالي الفلتر المحدّد ${state.selectedEmployeeFilter !== 'all' ? `(${state.selectedEmployeeFilter})` : ''}</span>
                <h3 class="text-2xl font-black text-amber-400 mt-2">${formatCurrency(filteredTotal)} <span class="text-xs text-slate-400 font-bold">ج.م</span></h3>
                <span class="text-[11px] text-slate-400 font-bold mt-1 block">عدد الفواتير/العمليات: ${filtered.length} عملية</span>
              </div>
              <div class="glass-card p-6 rounded-3xl border-r-4 border-r-indigo-500">
                <span class="text-xs font-bold text-slate-400">الإجمالي التراكمي الكلي</span>
                <h3 class="text-2xl font-black text-slate-100 mt-2">${formatCurrency(overallTotal)} <span class="text-xs text-slate-400 font-bold">ج.م</span></h3>
              </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
              <div class="lg:col-span-2 glass-card p-6 rounded-3xl">
                <h3 class="text-sm font-bold text-amber-400 mb-4 flex items-center gap-2"><span>📈</span> أعلى الموظفين تحصيلاً</h3>
                <div class="h-64 relative">
                  <canvas id="barChart"></canvas>
                </div>
              </div>
              <div class="glass-card p-6 rounded-3xl">
                <h3 class="text-sm font-bold text-amber-400 mb-4 flex items-center gap-2"><span>🍩</span> طرق إثبات التحصيل</h3>
                <div class="h-64 relative">
                  <canvas id="pieChart"></canvas>
                </div>
              </div>
            </div>

            <div class="glass-card rounded-3xl overflow-hidden">
              <div class="p-5 bg-slate-900/80 font-bold text-amber-400 border-b border-slate-800 flex justify-between items-center">
                <span>تقرير أداء الموظفين الـ 23</span>
              </div>
              <div class="overflow-x-auto">
                <table class="w-full text-right text-sm">
                  <thead class="bg-slate-900/90 text-slate-400 text-xs border-b border-slate-800">
                    <tr>
                      <th class="p-3.5">#</th>
                      <th class="p-3.5">الموظف</th>
                      <th class="p-3.5">إجمالي مبلغ التحصيل</th>
                      <th class="p-3.5">عدد الدفعات</th>
                      <th class="p-3.5">إجراء</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-slate-800/60">
                    ${summaries.map((emp, i) => `
                      <tr class="hover:bg-slate-800/40 transition-colors ${state.selectedEmployeeFilter === emp.name ? 'bg-amber-500/10' : ''}">
                        <td class="p-3.5 text-xs text-slate-500 font-bold">${i + 1}</td>
                        <td class="p-3.5 font-bold text-slate-200">${emp.name}</td>
                        <td class="p-3.5 text-emerald-400 font-black">${emp.totalAmount > 0 ? `${formatCurrency(emp.totalAmount)} ج.م` : '-'}</td>
                        <td class="p-3.5 text-xs text-slate-400 font-semibold">${emp.count} عملية</td>
                        <td class="p-3.5">
                          <button onclick="changeFilter('selectedEmployeeFilter', '${emp.name}')" class="text-xs bg-slate-800 text-amber-400 border border-slate-700 font-bold px-3 py-1.5 rounded-xl">
                            فلترة
                          </button>
                        </td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            </div>

            <div class="glass-card rounded-3xl overflow-hidden">
              <div class="p-5 bg-slate-900/80 font-bold text-amber-400 border-b border-slate-800">
                سجل المعاملات المباشرة (${filtered.length} عملية)
              </div>
              <div class="overflow-x-auto max-h-[450px] custom-scrollbar">
                <table class="w-full text-right text-sm">
                  <thead class="bg-slate-900/90 text-slate-400 text-xs sticky top-0 border-b border-slate-800 z-10">
                    <tr>
                      <th class="p-3.5">التاريخ</th>
                      <th class="p-3.5">الموظف</th>
                      <th class="p-3.5">المبلغ</th>
                      <th class="p-3.5">Account Number</th>
                      <th class="p-3.5">إثبات التحصيل</th>
                      <th class="p-3.5">حذف</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-slate-800/60">
                    ${filtered.map(row => `
                      <tr class="hover:bg-slate-800/40">
                        <td class="p-3.5 text-xs text-slate-400 font-mono">${row.date}</td>
                        <td class="p-3.5 font-bold text-slate-200">${row.employeeName}</td>
                        <td class="p-3.5 font-black text-emerald-400">${formatCurrency(row.amount)} ج.م</td>
                        <td class="p-3.5 text-slate-300 font-mono text-xs">${row.clientName}</td>
                        <td class="p-3.5 text-xs font-bold text-slate-300">${row.paymentType}</td>
                        <td class="p-3.5">
                          <button onclick="deleteItem('${row.id}')" class="text-red-400 font-bold text-xs bg-red-950/40 border border-red-800/50 px-2.5 py-1 rounded-lg">حذف</button>
                        </td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        `;
      }
    }

    function getFilteredCollections() {
      const todayStr = getTodayString();
      return state.collections.filter(item => {
        if (state.selectedEmployeeFilter !== 'all' && item.employeeName !== state.selectedEmployeeFilter) return false;
        if (state.searchQuery.trim() !== '') {
          const query = state.searchQuery.toLowerCase();
          const matchClient = (item.clientName || '').toLowerCase().includes(query);
          const matchNotes = (item.notes || '').toLowerCase().includes(query);
          const matchEmp = (item.employeeName || '').toLowerCase().includes(query);
          if (!matchClient && !matchNotes && !matchEmp) return false;
        }
        if (state.dateRangeFilter === 'today') return item.date === todayStr;
        if (state.dateRangeFilter === 'specific_day') return item.date === state.specificDate;
        if (state.dateRangeFilter === 'month') return item.date.startsWith(state.specificMonth);
        return true;
      });
    }

    let barChartInstance = null;
    let pieChartInstance = null;

    function initCharts() {
      setTimeout(() => {
        const filtered = getFilteredCollections();
        
        const empTotals = INITIAL_EMPLOYEES.map(emp => {
          const sum = filtered.filter(c => c.employeeName === emp).reduce((a, b) => a + b.amount, 0);
          return { name: emp, sum };
        }).sort((a, b) => b.sum - a.sum).slice(0, 7);

        const barCanvas = document.getElementById('barChart');
        if (barCanvas) {
          if (barChartInstance) barChartInstance.destroy();
          barChartInstance = new Chart(barCanvas, {
            type: 'bar',
            data: {
              labels: empTotals.map(e => e.name),
              datasets: [{
                label: 'المبلغ (ج.م)',
                data: empTotals.map(e => e.sum),
                backgroundColor: '#f59e0b',
                borderRadius: 8
              }]
            },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
          });
        }

        const paymentCounts = { 'إيصال': 0, 'اتصالات كاش': 0, 'غير معروف': 0 };
        filtered.forEach(c => {
          if (paymentCounts[c.paymentType] !== undefined) paymentCounts[c.paymentType] += c.amount;
        });

        const pieCanvas = document.getElementById('pieChart');
        if (pieCanvas) {
          if (pieChartInstance) pieChartInstance.destroy();
          pieChartInstance = new Chart(pieCanvas, {
            type: 'doughnut',
            data: {
              labels: Object.keys(paymentCounts),
              datasets: [{ data: Object.values(paymentCounts), backgroundColor: ['#10b981', '#3b82f6', '#64748b'] }]
            },
            options: { responsive: true, maintainAspectRatio: false }
          });
        }
      }, 100);
    }

    window.navigate = function(view) {
      state.currentView = view;
      render();
    };

    window.logoutAdmin = function() {
      state.isAdminLoggedIn = false;
      state.currentView = 'employee';
      render();
    };

    window.handleLoginSubmit = function(e) {
      e.preventDefault();
      const user = document.getElementById('loginUser').value;
      const pass = document.getElementById('loginPass').value;
      if (user === 'admin' && pass === 'admin123') {
        state.isAdminLoggedIn = true;
        state.currentView = 'admin_dashboard';
        state.loginError = '';
      } else {
        state.loginError = 'اسم المستخدم أو كلمة السر غير صحيحة!';
      }
      render();
    };

    window.changeFilter = function(key, value) {
      state[key] = value;
      render();
    };

    window.handleEmployeeSubmit = async function(e) {
      e.preventDefault();
      const amountVal = parseFloat(document.getElementById('empAmount').value);
      if (!amountVal || amountVal <= 0) return;

      const newRecord = {
        employeeName: document.getElementById('empName').value,
        amount: amountVal,
        date: document.getElementById('empDate').value || getTodayString(),
        paymentType: document.getElementById('empPaymentType').value,
        clientName: document.getElementById('empAccount').value || 'غير محدد',
        notes: document.getElementById('empNotes').value || '-',
        timestamp: Date.now()
      };

      if (window.CloudDB && window.CloudDB.db && window.CloudDB.auth.currentUser) {
        try {
          const { db, appId, collection, addDoc } = window.CloudDB;
          const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'collections');
          await addDoc(colRef, newRecord);
        } catch (err) {
          console.error("Cloud insert error:", err);
          newRecord.id = `col-${Date.now()}`;
          state.collections.unshift(newRecord);
          saveCollectionsLocally();
        }
      } else {
        newRecord.id = `col-${Date.now()}`;
        state.collections.unshift(newRecord);
        saveCollectionsLocally();
      }

      state.employeeSuccessMsg = `تم إرسال مبلغ ${formatCurrency(amountVal)} ج.م سحابياً بنجاح! 🎉`;
      render();

      setTimeout(() => {
        state.employeeSuccessMsg = '';
        render();
      }, 4000);
    };

    window.deleteItem = async function(id) {
      if (confirm('هل ترغب في حذف هذه العملية من السيرفر المباشر؟')) {
        if (window.CloudDB && window.CloudDB.db && window.CloudDB.auth.currentUser && !id.startsWith('col-')) {
          try {
            const { db, appId, doc, deleteDoc } = window.CloudDB;
            const itemRef = doc(db, 'artifacts', appId, 'public', 'data', 'collections', id);
            await deleteDoc(itemRef);
          } catch (err) {
            console.error("Cloud delete error:", err);
          }
        } else {
          state.collections = state.collections.filter(c => c.id !== id);
          saveCollectionsLocally();
          render();
        }
      }
    };

    window.exportToCSV = function() {
      const filtered = getFilteredCollections();
      const headers = ["التاريخ", "اسم الموظف", "المبلغ (ج.م)", "إثبات التحصيل", "Account Number", "ملاحظات"];
      const rows = filtered.map(c => [
        c.date, `"${c.employeeName}"`, c.amount, `"${c.paymentType}"`, `"${c.clientName}"`, `"${c.notes}"`
      ]);
      const csvContent = "\uFEFF" + [headers.join(","), ...rows.map(e => e.join(","))].join("\n");
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.setAttribute("href", url);
      link.setAttribute("download", `Shift_Night_Report_${getTodayString()}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    };

    window.onload = render;
  </script>
</body>
</html>
