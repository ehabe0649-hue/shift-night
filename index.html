    const firebaseConfig = {

    const appId = 'shift-night-live-db';
    const app = initializeApp(firebaseConfig);

    window.CloudDB = {

    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap');
    body { font-family: 'Cairo', sans-serif; transition: background 0.4s ease, color 0.4s ease; }
    body.theme-midnight { background: radial-gradient(circle at top right, #0f172a, #020617 80%); color: #f8fafc; }
    body.theme-cyber { background: radial-gradient(circle at top right, #090d16, #030712 80%); color: #f1f5f9; }
    body.theme-espresso { background: radial-gradient(circle at top right, #1c130e, #0c0806 80%); color: #fef3c7; }

    }
    .ticker-wrap { width: 100%; overflow: hidden; background: #b45309; color: white; padding: 10px 0; box-sizing: content-box; position: relative; }
    .ticker { display: inline-block; white-space: nowrap; padding-left: 100%; animation: marquee var(--ticker-speed, 80s) linear infinite; font-weight: bold; font-size: 1.1rem; }
    .ticker.stopped { animation: none; padding-left: 0; display: block; text-align: center; width: 100%; }

    #celebrationOverlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(2, 6, 23, 0.95); z-index: 9999;
      display: none; flex-direction: column; align-items: center; justify-content: center;

    }
    #celebrationOverlay.show { display: flex; animation: fadeIn 0.5s ease; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    let cashNotificationAudio = null;
    function playNotificationMusic() {
      try {
        if (!cashNotificationAudio) {
          cashNotificationAudio = new Audio(CASH_SOUND_DATA);
          cashNotificationAudio.volume = 0.9;
        }
        cashNotificationAudio.pause();
        cashNotificationAudio.currentTime = 0;
        const playPromise = cashNotificationAudio.play();
        if (playPromise && typeof playPromise.catch === "function") {
          playPromise.catch(e => console.log("Notification sound blocked:", e));
        }
      } catch (e) { console.log("Audio play error:", e); }
    }

    // موسيقى الاحتفال (نغمة أطول)
    function playCelebrationMusic() {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        const notes = [523.25, 659.25, 783.99, 1046.50, 783.99, 1046.50]; 
        notes.forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.2);
          gain.gain.setValueAtTime(0, ctx.currentTime + i * 0.2);
          gain.gain.linearRampToValueAtTime(0.3, ctx.currentTime + i * 0.2 + 0.05);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.2 + 0.5);
          osc.start(ctx.currentTime + i * 0.2);
          osc.stop(ctx.currentTime + i * 0.2 + 0.5);
        });
      } catch (e) { console.log("Celebration audio error:", e); }
    }

    const getHeroData = () => {
      const today = new Date();
      const dayOfMonth = today.getDate();
      const todayStr = getTodayString();
      const monthStr = getTodayString().slice(0, 7);

      let isMonthlyMode = dayOfMonth >= 21;
      let relevantCollections = isMonthlyMode 
        ? state.collections.filter(c => c.date.startsWith(monthStr))
        : state.collections.filter(c => c.date === todayStr);

      if (relevantCollections.length === 0 && dayOfMonth !== 30) return null;

      const totalsByEmp = {};
      relevantCollections.forEach(c => {
        if (!totalsByEmp[c.employeeName]) { totalsByEmp[c.employeeName] = 0; }
        totalsByEmp[c.employeeName] += c.amount;
      });

      let heroName = null;
      let maxAmount = 0;
      for (const [name, total] of Object.entries(totalsByEmp)) {
        if (total > maxAmount) { maxAmount = total; heroName = name; }
      }

      const isDay30 = dayOfMonth === 30;

      return { 
        name: heroName || "لا يوجد تحصيل", 
        amount: maxAmount, 
        isMonthly: isMonthlyMode, 
        isDay30: isDay30 
      };
    };

    function checkCelebrationTime() {
      const now = new Date();
      const day = now.getDate();
      const hours = now.getHours();
      const minutes = now.getMinutes();
      
      if (day === 30 && (hours > 21 || (hours === 21 && minutes >= 30))) {
        showCelebration();
      }
    }

    function showCelebration() {
      const overlay = document.getElementById('celebrationOverlay');
      if (overlay.classList.contains('show')) return;

      const monthStr = getTodayString().slice(0, 7);
      const monthlyTotal = state.collections.filter(c => c.date.startsWith(monthStr)).reduce((acc, curr) => acc + curr.amount, 0);
      
      const hero = getHeroData();
      
      document.getElementById('celebrationTotal').textContent = formatCurrency(monthlyTotal);
      if (hero && hero.name !== "لا يوجد تحصيل") {
        document.getElementById('celebrationHeroName').textContent = hero.name;
        document.getElementById('celebrationHeroImg').src = getEmployeeImage(hero.name);
      } else {
        document.getElementById('celebrationHeroName').textContent = "Team";
        document.getElementById('celebrationHeroImg').style.display = 'none';
      }
      
      overlay.classList.add('show');
    }

    let state = {
      currentView: 'employee',
      isAdminLoggedIn: false,
      currentTheme: localStorage.getItem('shift_night_theme') || 'midnight',
      collections: JSON.parse(localStorage.getItem('shift_night_local_fallback')) || [],
      newsTicker: '',
      isTickerActive: false,
      tickerSpeed: 80,
      dateRangeFilter: 'all',
      specificDate: getTodayString(),
      specificMonth: getTodayString().slice(0, 7),
      selectedEmployeeFilter: 'all',
      searchQuery: '',
      loginError: '',
      employeeSuccessMsg: '',
      isCloudConnected: false,
      soundEnabled: localStorage.getItem('shift_night_sound') === 'true'
    };

    window.toggleSound = function() {
      state.soundEnabled = !state.soundEnabled;
      localStorage.setItem('shift_night_sound', state.soundEnabled);
      if (state.soundEnabled) playNotificationMusic();
      render();
    };

    window.initCloudSync = async function() {
      if (!window.CloudDB) return;
      const { db, auth, appId, collection, onSnapshot, signInAnonymously, doc } = window.CloudDB;

      try {
        await signInAnonymously(auth);
        
        const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'collections');
        onSnapshot(colRef, (snapshot) => {
          const cloudData = [];
          snapshot.forEach((docSnap) => { cloudData.push({ id: docSnap.id, ...docSnap.data() }); });
          cloudData.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
          
          if (state.collections.length > 0 && cloudData.length > 0 && cloudData[0].id !== state.collections[0].id) {
            if (state.soundEnabled) playNotificationMusic();
          }

          state.collections = cloudData;
          state.isCloudConnected = true;
          localStorage.setItem('shift_night_local_fallback', JSON.stringify(cloudData));
          render();
        });

        const tickerDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'news_ticker');
        onSnapshot(tickerDocRef, (docSnap) => {
          if (docSnap.exists()) {
            const data = docSnap.data();
            state.newsTicker = data.text || '';
            state.isTickerActive = data.active || false;
            state.tickerSpeed = data.speed || 80;
          } else {
            state.newsTicker = '';
            state.isTickerActive = false;
            state.tickerSpeed = 80;
          }
          render();
        });

      } catch (err) {
        console.error("Auth / Cloud error:", err);
        state.isCloudConnected = false;
        render();
      }
    };

      if (!window.CloudDB) return;
      const { db, appId, doc, setDoc } = window.CloudDB;
      const tickerDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'news_ticker');
      try {
        await setDoc(tickerDocRef, { text: text, active: active, speed: speed }, { merge: true });
        state.newsTicker = text;
        state.isTickerActive = active;
        state.tickerSpeed = speed;
        render();
      } catch (err) { console.error("Error updating ticker:", err); alert("حدث خطأ أثناء تحديث النشرة"); }
    };

            </div>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-5">
              <div class="glass-card p-6 rounded-3xl border-r-4 border-r-emerald-500"><span class="text-xs font-bold text-slate-400">Today's Collections</span><h3 class="text-2xl font-black text-emerald-400 mt-2">${formatCurrency(todayTotal)} <span class="text-xs text-slate-400 font-bold">EGP</span></h3></div>
              <div class="glass-card p-6 rounded-3xl border-r-4 border-r-amber-500"><span class="text-xs font-bold text-amber-400">Filtered Total ${state.selectedEmployeeFilter !== 'all' ? `(${state.selectedEmployeeFilter})` : ''}</span><h3 class="text-2xl font-black text-amber-400 mt-2">${formatCurrency(filteredTotal)} <span class="text-xs text-slate-400 font-bold">EGP</span></h3><span class="text-[11px] text-slate-400 font-bold mt-1 block">Transactions: ${filtered.length}</span></div>
              <div class="glass-card p-6 rounded-3xl border-r-4 border-r-indigo-500"><span class="text-xs font-bold text-slate-400">Overall Total</span><h3 class="text-2xl font-black text-slate-100 mt-2">${formatCurrency(overallTotal)} <span class="text-xs text-slate-400 font-bold">EGP</span></h3></div>
            </div>
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
              <div class="lg:col-span-2 glass-card p-6 rounded-3xl"><h3 class="text-sm font-bold text-amber-400 mb-4 flex items-center gap-2"><span>📈</span> Top Performers</h3><div class="h-64 relative"><canvas id="barChart"></canvas></div></div>
              <div class="glass-card p-6 rounded-3xl"><h3 class="text-sm font-bold text-amber-400 mb-4 flex items-center gap-2"><span>🍩</span> Payment Methods</h3><div class="h-64 relative"><canvas id="pieChart"></canvas></div></div>
            </div>
            <div class="glass-card rounded-3xl overflow-hidden">
              <div class="p-5 bg-slate-900/80 font-bold text-amber-400 border-b border-slate-800 flex justify-between items-center"><span>Employee Performance Report</span></div>
              <div class="overflow-x-auto">
                <table class="w-full text-right text-sm">
                  <thead class="bg-slate-900/90 text-slate-400 text-xs border-b border-slate-800"><tr><th class="p-3.5">#</th><th class="p-3.5">Employee</th><th class="p-3.5">Total Amount</th><th class="p-3.5">Payments Count</th><th class="p-3.5">Action</th></tr></thead>
                  <tbody class="divide-y divide-slate-800/60">
                    ${summaries.map((emp, i) => `
                      <tr class="hover:bg-slate-800/40 transition-colors ${state.selectedEmployeeFilter === emp.name ? 'bg-amber-500/10' : ''}">
                        <td class="p-3.5 text-xs text-slate-500 font-bold">${i + 1}</td>
                        <td class="p-3.5 font-bold text-slate-200">${emp.name}</td>
                        <td class="p-3.5 text-emerald-400 font-black">${emp.totalAmount > 0 ? `${formatCurrency(emp.totalAmount)} EGP` : '-'}</td>
                        <td class="p-3.5 text-xs text-slate-400 font-semibold">${emp.count} ops</td>
                        <td class="p-3.5"><button onclick="changeFilter('selectedEmployeeFilter', '${emp.name}')" class="text-xs bg-slate-800 text-amber-400 border border-slate-700 font-bold px-3 py-1.5 rounded-xl">Filter</button></td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            </div>
            <div class="glass-card rounded-3xl overflow-hidden">
              <div class="p-5 bg-slate-900/80 font-bold text-amber-400 border-b border-slate-800">Live Transactions (${filtered.length} ops)</div>
              <div class="overflow-x-auto max-h-[450px] custom-scrollbar">
                <table class="w-full text-right text-sm">
                  <thead class="bg-slate-900/90 text-slate-400 text-xs sticky top-0 border-b border-slate-800 z-10"><tr><th class="p-3.5">Date</th><th class="p-3.5">Employee</th><th class="p-3.5">Amount</th><th class="p-3.5">Account Number</th><th class="p-3.5">Payment Type</th><th class="p-3.5">Notes</th><th class="p-3.5">Delete</th></tr></thead>
                  <tbody class="divide-y divide-slate-800/60">
                    ${filtered.map(row => `
                      <tr class="hover:bg-slate-800/40">
                        <td class="p-3.5 text-xs text-slate-400 font-mono">${row.date}</td>
                        <td class="p-3.5 font-bold text-slate-200">${row.employeeName}</td>
                        <td class="p-3.5 font-black text-emerald-400">${formatCurrency(row.amount)} EGP</td>
                        <td class="p-3.5 text-slate-300 font-mono text-lg font-bold">${row.clientName}</td>
                        <td class="p-3.5 text-xs font-bold text-slate-300">${row.paymentType}</td>
                        <td class="p-3.5 text-xs text-slate-400 max-w-[200px] truncate" title="${row.notes}">${row.notes}</td>
                        <td class="p-3.5"><button onclick="deleteItem('${row.id}')" class="text-red-400 font-bold text-xs bg-red-950/40 border border-red-800/50 px-2.5 py-1 rounded-lg">Delete</button></td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        `;
      }
    }

    function getFilteredCollections() {
      const todayStr = getTodayString();
      return state.collections.filter(item => {
        if (state.selectedEmployeeFilter !== 'all' && item.employeeName !== state.selectedEmployeeFilter) return false;
        if (state.searchQuery.trim() !== '') {
          const query = state.searchQuery.toLowerCase();
          const matchClient = (item.clientName || '').toLowerCase().includes(query);
          const matchNotes = (item.notes || '').toLowerCase().includes(query);
          const matchEmp = (item.employeeName || '').toLowerCase().includes(query);
          if (!matchClient && !matchNotes && !matchEmp) return false;
        }
        if (state.dateRangeFilter === 'today') return item.date === todayStr;
        if (state.dateRangeFilter === 'specific_day') return item.date === state.specificDate;
        if (state.dateRangeFilter === 'month') return item.date.startsWith(state.specificMonth);
        return true;
      });
    }

    let barChartInstance = null;
    let pieChartInstance = null;

    function initCharts() {
      setTimeout(() => {
        const filtered = getFilteredCollections();
        const empTotals = INITIAL_EMPLOYEES.map(emp => {
          const sum = filtered.filter(c => c.employeeName === emp).reduce((a, b) => a + b.amount, 0);
          return { name: emp, sum };
        }).sort((a, b) => b.sum - a.sum).slice(0, 7);

        const barCanvas = document.getElementById('barChart');
        if (barCanvas) {
          if (barChartInstance) barChartInstance.destroy();
          barChartInstance = new Chart(barCanvas, {
            type: 'bar',
            data: { labels: empTotals.map(e => e.name), datasets: [{ label: 'Amount (EGP)', data: empTotals.map(e => e.sum), backgroundColor: '#f59e0b', borderRadius: 8 }] },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
          });
        }

        const paymentCounts = { 'إيصال': 0, 'اتصالات كاش': 0, 'غير معروف': 0, 'مشكلة في الكاش': 0 };
        filtered.forEach(c => { if (paymentCounts[c.paymentType] !== undefined) paymentCounts[c.paymentType] += c.amount; });

        const pieCanvas = document.getElementById('pieChart');
        if (pieCanvas) {
          if (pieChartInstance) pieChartInstance.destroy();
          pieChartInstance = new Chart(pieCanvas, {
            type: 'doughnut',
            data: { labels: Object.keys(paymentCounts), datasets: [{ data: Object.values(paymentCounts), backgroundColor: ['#10b981', '#3b82f6', '#ef4444', '#64748b'] }] },
            options: { responsive: true, maintainAspectRatio: false }
          });
        }
      }, 100);
    }

    window.navigate = function(view) { state.currentView = view; render(); };
    window.logoutAdmin = function() { state.isAdminLoggedIn = false; state.currentView = 'employee'; render(); };

    window.handleLoginSubmit = function(e) {
      e.preventDefault();
      const user = document.getElementById('loginUser').value;
      const pass = document.getElementById('loginPass').value;
      if (user === 'MAHER123' && pass === 'EBM123456') {
        state.isAdminLoggedIn = true;
        state.currentView = 'admin_dashboard';
        state.loginError = '';
      } else {
        state.loginError = 'اسم المستخدم أو كلمة السر غير صحيحة!';
      }
      render();
    };

    window.changeFilter = function(key, value) { state[key] = value; render(); };

    window.handleEmployeeSubmit = async function(e) {
      e.preventDefault();
      const amountVal = parseFloat(document.getElementById('empAmount').value);
      const dateVal = document.getElementById('empDate').value || 'غير محدد';
      const paymentTypeVal = document.getElementById('empPaymentType').value;

      if (!amountVal || amountVal <= 0) { alert('الرجاء إدخال مبلغ صحيح'); return; }

      const newRecord = {
        employeeName: document.getElementById('empName').value,
        amount: amountVal,
        date: paymentTypeVal === 'غير معروف' ? 'غير محدد' : dateVal,
        paymentType: paymentTypeVal,
        clientName: document.getElementById('empAccount').value || 'غير محدد',
        notes: document.getElementById('empNotes').value || '-',
        timestamp: Date.now()
      };

      if (window.CloudDB && window.CloudDB.db && window.CloudDB.auth.currentUser) {
        try {
          const { db, appId, collection, addDoc } = window.CloudDB;
          const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'collections');
          await addDoc(colRef, newRecord);
        } catch (err) {
          console.error("Cloud insert error:", err);
          newRecord.id = `col-${Date.now()}`;
          state.collections.unshift(newRecord);
          saveCollectionsLocally();
        }
      } else {
        newRecord.id = `col-${Date.now()}`;
        state.collections.unshift(newRecord);
        saveCollectionsLocally();
      }

      state.employeeSuccessMsg = `تم إرسال مبلغ ${formatCurrency(amountVal)} ج.م سحابياً بنجاح! 🎉`;
      render();
      setTimeout(() => { state.employeeSuccessMsg = ''; render(); }, 4000);
    };

    window.deleteItem = async function(id) {
      if (confirm('Are you sure you want to delete this transaction?')) {
        if (window.CloudDB && window.CloudDB.db && window.CloudDB.auth.currentUser && !id.startsWith('col-')) {
          try {
            const { db, appId, doc, deleteDoc } = window.CloudDB;
            const itemRef = doc(db, 'artifacts', appId, 'public', 'data', 'collections', id);
            await deleteDoc(itemRef);
          } catch (err) { console.error("Cloud delete error:", err); }
        } else {
          state.collections = state.collections.filter(c => c.id !== id);
          saveCollectionsLocally();
          render();
        }
      }
    };

    window.exportToCSV = function() {
      const filtered = getFilteredCollections();
      const headers = ["Date", "Employee", "Amount (EGP)", "Payment Type", "Account Number", "Notes"];
      const rows = filtered.map(c => [c.date, `"${c.employeeName}"`, c.amount, `"${c.paymentType}"`, `"${c.clientName}"`, `"${c.notes}"`]);
      const csvContent = "\uFEFF" + [headers.join(","), ...rows.map(e => e.join(","))].join("\n");
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.setAttribute("href", url);
      link.setAttribute("download", `Shift_Night_Report_${getTodayString()}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    };

    window.onload = render;
  </script>
</body>
</html>
